<style>
  .sub-head {
    background: var(--ink); color: #fff; padding: 22px 5vw;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .sub-head .logo { height: 38px; filter: brightness(0) invert(1); }
  .sub-head .links { display: flex; gap: 10px; align-items: center; }

  /* 头图：这张里有会旗、有锦旗，一眼能说明这是什么组织在做什么事 */
  .hero {
    position: relative; background: var(--ink);
    min-height: 46vh; display: flex; align-items: flex-end;
    overflow: hidden;
  }
  .hero img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: .55;
  }
  .hero .inner {
    position: relative; z-index: 1; color: #fff;
    padding: 60px 5vw 40px; max-width: var(--maxw); margin: 0 auto; width: 100%;
  }
  .hero .eyebrow { font-size: .76rem; letter-spacing: 4px; color: var(--lilac); margin: 0 0 12px; }
  .hero h1 { margin: 0 0 14px; font-size: clamp(1.9rem, 5.5vw, 3.1rem); letter-spacing: 4px; }
  .hero p { margin: 0; max-width: 46ch; line-height: 1.9; font-size: .96rem; opacity: .92; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 5vw; }

  .year { padding: 72px 0; }
  .year:not(:last-child) { border-bottom: 1px solid var(--line); }
  .year-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .year-head h2 {
    margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); color: var(--ink);
    letter-spacing: 2px; font-variant-numeric: tabular-nums;
  }
  .year-head .tag {
    font-size: .74rem; letter-spacing: 2px; color: var(--lilac);
    font-weight: bold; text-transform: uppercase;
  }
  .year .lead { color: var(--muted); margin: 0 0 34px; line-height: 1.9; max-width: 54ch; }

  /* 照片墙：固定行高的格子，说明压在图上。
     一开始做的是「图 + 下方说明」，结果占两格的图比同排单格的高，
     每一行都对不齐、右边留一块洞。行高固定之后，占几格就是几格宽，
     高度永远一致，整面墙才立得住。dense 让偶尔的空位自动被后面的图补上。 */
  .shots {
    display: grid; grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 230px; grid-auto-flow: dense; gap: 14px;
  }
  .shot { position: relative; margin: 0; border-radius: 12px; overflow: hidden; background: var(--paper-2); }
  .shot a { display: block; width: 100%; height: 100%; }
  .shot img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    transition: transform .5s ease;
  }
  .shot a:hover img { transform: scale(1.04); }
  .shot a:focus-visible { outline: 3px solid var(--lilac); outline-offset: -3px; }
  .shot figcaption {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1;
    padding: 34px 14px 12px; color: #fff; font-size: .86rem; line-height: 1.6;
    background: linear-gradient(to bottom, rgba(20,21,36,0), rgba(20,21,36,.86));
    pointer-events: none;
  }
  .shot.w2 { grid-column: span 2; }
  .shot.h2 { grid-row: span 2; }

  @media (max-width: 1000px) {
    .shots { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 200px; }
  }
  /* 手机上一律一张一行：横向再切格子，人脸就只剩半张了 */
  @media (max-width: 640px) {
    .shots { grid-template-columns: 1fr; grid-auto-rows: auto; }
    .shot.w2, .shot.h2 { grid-column: auto; grid-row: auto; }
    .shot img { aspect-ratio: 4 / 3; height: auto; }
    .shot.tallish img { aspect-ratio: 3 / 4; }
  }

  .tail { padding: 60px 0 90px; text-align: center; }
  .tail p { color: var(--muted); line-height: 1.9; margin: 0 0 22px; }

  /* 点开看大图。没有 JS 时链接照样能用（直接打开大图），所以不算硬依赖。 */
  .lb {
    position: fixed; inset: 0; z-index: 80; background: rgba(20,21,36,.93);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
  }
  .lb[hidden] { display: none; }
  .lb img { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 6px; }
  .lb .cap { color: #fff; margin-top: 18px; font-size: .92rem; text-align: center; max-width: 60ch; }
  .lb .cap .n { color: var(--lilac); margin-left: 10px; font-variant-numeric: tabular-nums; }
  .lb button {
    position: absolute; background: rgba(255,255,255,.12); color: #fff;
    border: 1px solid rgba(255,255,255,.3); border-radius: 999px; cursor: pointer;
    width: 46px; height: 46px; font-size: 1.2rem; line-height: 1;
  }
  .lb .x { top: 18px; right: 18px; }
  .lb .prev { left: 18px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 18px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 640px) {
    .lb .prev { left: 10px; } .lb .next { right: 10px; }
  }
</style>

<!-- 看大图。没有 JS 也能用：上面每张图本来就是指向大图的普通链接。 -->
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="查看大图">
  <button class="x" type="button" id="lbClose" aria-label="关闭">✕</button>
  <button class="prev" type="button" id="lbPrev" aria-label="上一张">‹</button>
  <button class="next" type="button" id="lbNext" aria-label="下一张">›</button>
  <img id="lbImg" alt="">
  <div class="cap"><span id="lbCap"></span><span class="n" id="lbNum"></span></div>
</div>

<script>
(function () {
  "use strict";
  var links = Array.prototype.slice.call(document.querySelectorAll(".shot a"));
  if (!links.length) return;

  var lb = document.getElementById("lb");
  var img = document.getElementById("lbImg");
  var cap = document.getElementById("lbCap");
  var num = document.getElementById("lbNum");
  var idx = 0;

  function show(i) {
    idx = (i + links.length) % links.length;
    var a = links[idx];
    img.src = a.getAttribute("href");
    img.alt = a.querySelector("img").alt;
    cap.textContent = a.getAttribute("data-cap") || "";
    num.textContent = (idx + 1) + " / " + links.length;
    lb.hidden = false;
    document.body.style.overflow = "hidden";
  }
  function close() {
    lb.hidden = true;
    img.src = "";                 // 放掉大图，别让它一直占着内存
    document.body.style.overflow = "";
    links[idx].focus();
  }

  links.forEach(function (a, i) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      show(i);
    });
  });

  document.getElementById("lbClose").addEventListener("click", close);
  document.getElementById("lbPrev").addEventListener("click", function () { show(idx - 1); });
  document.getElementById("lbNext").addEventListener("click", function () { show(idx + 1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
  document.addEventListener("keydown", function (e) {
    if (lb.hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") show(idx - 1);
    else if (e.key === "ArrowRight") show(idx + 1);
  });
})();
</script>
